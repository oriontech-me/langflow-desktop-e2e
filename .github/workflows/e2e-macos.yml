name: Langflow Desktop E2E (macOS)

# Manual only: macOS minutes count 10x on the free plan (a run takes ~4 min, ~40 min of quota).
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build to test: link or id of a "Build Unsigned" run built with enable_webdriver (list: "Langflow Desktop builds" workflow). Empty = latest on the branch below'
        required: false
        default: ''
      desktop_branch:
        description: 'langflow-desktop branch used when "build" is empty'
        required: false
        default: 'release-1.14.0'

concurrency:
  group: desktop-e2e-macos
  cancel-in-progress: false

env:
  DESKTOP_REPO: langflow-ai/langflow-desktop
  DMG_ARTIFACT: langflow-macos-arm-dmg

jobs:
  e2e:
    # Apple Silicon runner, matching the arm DMG.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Only builds dispatched with enable_webdriver=true embed the WebDriver server the tests talk to.
      - name: Resolve WebDriver-enabled Build Unsigned run
        id: build
        env:
          GH_TOKEN: ${{ secrets.LANGFLOW_DESKTOP_TOKEN }}
          BUILD: ${{ inputs.build }}
          BRANCH: ${{ inputs.desktop_branch || 'release-1.14.0' }}
        run: |
          run_id=$(scripts/desktop-builds.sh resolve "$DMG_ARTIFACT" "$BRANCH" "$BUILD" webdriver)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Testing the DMG of $(scripts/desktop-builds.sh describe "$run_id")" >> "$GITHUB_STEP_SUMMARY"

      - name: Download DMG
        env:
          GH_TOKEN: ${{ secrets.LANGFLOW_DESKTOP_TOKEN }}
        run: gh run download ${{ steps.build.outputs.run_id }} -R "$DESKTOP_REPO" -n "$DMG_ARTIFACT" -D artifacts

      - name: Install Langflow Desktop
        run: |
          dmg=$(ls artifacts/*.dmg | head -1)
          [ -n "$dmg" ] || { echo "::error::No .dmg in the $DMG_ARTIFACT artifact"; exit 1; }
          app=$(scripts/install-langflow-desktop-macos.sh "$dmg")
          echo "LANGFLOW_DESKTOP_APP=$app" >> "$GITHUB_ENV"
          echo "Installed: \`$(basename "$dmg")\` → \`$app\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run E2E
        run: npm run test:mac

      # Logs only: ~/.langflow/data also holds the database and a .env that may carry secrets.
      - name: Collect Langflow Desktop logs
        if: always()
        run: |
          mkdir -p test-results/app-logs
          cp -R ~/Library/Logs/com.LangflowDesktop test-results/app-logs/ 2>/dev/null || true
          find ~/.langflow -name '*.log' -not -path '*/.langflow-venv/*' -exec cp {} test-results/app-logs/ \; 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-macos-${{ github.run_id }}
          path: test-results/
          retention-days: 14
