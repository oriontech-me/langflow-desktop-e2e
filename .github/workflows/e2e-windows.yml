name: Langflow Desktop E2E (Windows)

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build to test: link or id of a "Build Unsigned" run (list: "Langflow Desktop builds" workflow). Empty = latest on the branch below'
        required: false
        default: ''
      desktop_branch:
        description: 'langflow-desktop branch used when "build" is empty'
        required: false
        default: 'release-1.13.0'
  # Manual only for now: Windows minutes count 2x on the free plan. Re-enable once the suite is stable:
  # schedule:
  #   - cron: '0 9 * * 1-5'  # 06:00 BRT, Mon–Fri

concurrency:
  group: desktop-e2e-windows
  cancel-in-progress: false

env:
  DESKTOP_REPO: langflow-ai/langflow-desktop
  MSI_ARTIFACT: langflow-windows-msi

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Build Unsigned run
        id: build
        shell: bash
        env:
          # Fine-grained PAT with Actions: read on langflow-ai/langflow-desktop
          GH_TOKEN: ${{ secrets.LANGFLOW_DESKTOP_TOKEN }}
          BUILD: ${{ inputs.build }}
          BRANCH: ${{ inputs.desktop_branch || 'release-1.13.0' }}
        run: |
          run_id=$(scripts/desktop-builds.sh resolve "$MSI_ARTIFACT" "$BRANCH" "$BUILD")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Testing MSI from https://github.com/$DESKTOP_REPO/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Download MSI
        env:
          GH_TOKEN: ${{ secrets.LANGFLOW_DESKTOP_TOKEN }}
        run: gh run download ${{ steps.build.outputs.run_id }} -R $env:DESKTOP_REPO -n $env:MSI_ARTIFACT -D artifacts

      - name: Install Langflow Desktop
        run: |
          $msi = Get-ChildItem artifacts -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "No .msi in the $env:MSI_ARTIFACT artifact" }
          $exe = ./scripts/install-langflow-desktop.ps1 -MsiPath $msi.FullName
          "LANGFLOW_DESKTOP_EXE=$exe" >> $env:GITHUB_ENV
          "Installed: ``$($msi.Name)`` → ``$exe``" >> $env:GITHUB_STEP_SUMMARY

      # Runner processes are elevated, and elevated WebView2 hosts ignore WEBVIEW2_* env vars and HKCU
      # policies. The HKLM AdditionalBrowserArguments policy is still honoured, so it opens the debug
      # port that msedgedriver attaches to (see wdio.conf.ts). "*" = every WebView2 app on this throwaway VM.
      - name: Enable WebView2 remote debugging (HKLM policy)
        run: |
          $key = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name '*' -Value '--remote-debugging-port=9222' -PropertyType String -Force | Out-Null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run E2E
        run: npm test

      # Collect straight after the tests: relaunching the app would rotate its log and lose the run's history.
      - name: Collect Langflow Desktop logs
        if: always()
        run: |
          $roots = @{
            local   = Join-Path $env:LOCALAPPDATA 'com.LangflowDesktop'
            roaming = Join-Path $env:APPDATA 'com.LangflowDesktop'
          }
          foreach ($name in $roots.Keys) {
            $root = $roots[$name]
            if (-not (Test-Path $root)) { continue }
            # Skip the venv: thousands of package files, none of them logs we need.
            Get-ChildItem $root -Recurse -File -Include *.log, *.txt -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\\.langflow-venv\\' } |
              ForEach-Object {
                $dest = Join-Path "test-results/app-logs/$name" $_.FullName.Substring($root.Length)
                New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                Copy-Item -LiteralPath $_.FullName -Destination $dest
              }
          }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-windows-${{ github.run_id }}
          path: test-results/
          retention-days: 14
