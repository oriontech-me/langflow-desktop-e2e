name: Langflow Desktop builds

# Lists the langflow-desktop "Build Unsigned" runs whose installers can still be downloaded, so you can
# pick one for the E2E workflows' "build" input. Runs on Linux: a few seconds, no Windows/macOS minutes.
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: List downloadable builds
        env:
          GH_TOKEN: ${{ secrets.LANGFLOW_DESKTOP_TOKEN }}
        run: |
          {
            echo "## Builds you can test"
            echo
            echo "Copy a build's link (or id) into the **build** input of *Langflow Desktop E2E (Windows)* or *(macOS)*."
            echo "macOS needs a DMG **with WebDriver** (\"Build Unsigned\" dispatched with \`enable_webdriver\`)."
            echo "Installers expire 7 days after the build."
            echo
            scripts/desktop-builds.sh list
          } >> "$GITHUB_STEP_SUMMARY"
